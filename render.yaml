services:
  - type: web
    name: optimizer-quest
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 app:app
    envVars:
      - key: TRAIN_SUBSET_SIZE
        value: 5000
      - key: VAL_SUBSET_SIZE
        value: 1000
      - key: TEST_SUBSET_SIZE
        value: 1000
